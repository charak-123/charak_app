name: patient_app
description: Charak — Patient app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  charak_core:
    path: ../../packages/charak_core
  go_router: ^14.6.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  geolocator: ^13.0.2
  supabase_flutter: ^2.7.0
  intl: ^0.20.3
  pinput: ^6.0.0
  audioplayers: ^6.1.0
  record: ^5.2.0
  shadcn_ui: ^0.26.5
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0
  skeletonizer: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
