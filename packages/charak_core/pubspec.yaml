name: charak_core
description: Shared package for Charak apps — design system V2 (tokens, theme, components, fonts), auth, API client.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
  http_parser: ^4.0.2
  shadcn_ui: ^0.26.5
  agora_rtc_engine: ^6.6.4
  permission_handler: ^11.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Brand mark cut from design-system/CHARAK_Design_System_V2.pdf (page 1).
  # Load with CharakLogoMark, never Image.asset directly.
  assets:
    - assets/brand/

  # Anek (Ek Type, SIL OFL 1.1). One variable family, two scripts. Width and
  # weight come from the wdth/wght axes, so a single file per script covers
  # every style. Apps reference it as 'packages/charak_core/Anek'
  # (CharakType.family); they must not declare their own fonts.
  fonts:
    - family: Anek
      fonts:
        - asset: fonts/AnekLatin-Variable.ttf
    - family: AnekDevanagari
      fonts:
        - asset: fonts/AnekDevanagari-Variable.ttf
